<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Offline — TaskApp</title>
  <meta name="theme-color" content="#0052CC">
  <style>
    :root {
      --brand-primary: #0052CC;
      --brand-primary-hover: #0747A6;
      --neutral-bg: #F7F8F9;
      --text-primary: #172B4D;
      --text-secondary: #6B778C;
      --text-inverse: #FFFFFF;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--neutral-bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      padding-bottom: calc(1rem + env(safe-area-inset-bottom));
    }
    .container { text-align: center; max-width: 400px; }
    .icon {
      width: 80px; height: 80px;
      background: var(--brand-primary);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem;
    }
    .icon span { color: var(--text-inverse); font-weight: 700; font-size: 2rem; }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem; }
    p { color: var(--text-secondary); font-size: 0.875rem; line-height: 1.5; margin-bottom: 1.5rem; }
    button {
      min-height: 44px; min-width: 44px;
      padding: 0 24px;
      background: var(--brand-primary);
      color: var(--text-inverse);
      border: none; border-radius: 3px;
      font-size: 0.875rem; font-weight: 500; cursor: pointer;
    }
    button:hover { background: var(--brand-primary-hover); }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon"><span>TA</span></div>
    <h1>You&apos;re offline</h1>
    <p>TaskApp needs a connection for tasks, files, and notifications. Cached pages may still open; try again when you&apos;re back online.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
